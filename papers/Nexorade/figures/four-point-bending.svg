</style><rect class="bg" width="560" height="300" rx="8"/><text class="ink" x="16" y="26" font-size="15" font-weight="600">Four-point bending of each nexor under the plate moment M</text><line class="axis" x1="60" y1="105" x2="520" y2="105" stroke-width="1"/><path class="s1" d="M60.0,73.0 L195.3,73.0 L195.3,105.0 L384.7,105.0 L384.7,137.0 L520.0,137.0" stroke-width="2"/><text class="ink2" x="60" y="63" font-size="13">shear r = M / (cos φ sin φ)</text><line class="axis" x1="60" y1="250" x2="520" y2="250" stroke-width="1"/><path class="s2" d="M60.0,250.0 L195.3,190.0 L384.7,190.0 L520.0,250.0" stroke-width="2"/><text class="ink2" x="201" y="182" font-size="13">moment m = M L / cos φ</text><text class="ink2" x="124" y="270" font-size="13">a</text><text class="ink2" x="286" y="270" font-size="13">b</text><text class="ink2" x="448" y="270" font-size="13">a</text><circle class="node" cx="60.0" cy="250" r="4" stroke-width="1.5"/><circle class="node" cx="195.3" cy="250" r="4" stroke-width="1.5"/><circle class="node" cx="384.7" cy="250" r="4" stroke-width="1.5"/><circle class="node" cx="520.0" cy="250" r="4" stroke-width="1.5"/></svg>
