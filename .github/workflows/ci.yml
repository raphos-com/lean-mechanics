name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, no sorry/axiom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail"

      - name: Build papers
        working-directory: papers
        run: lake build --wfail

      - name: Check for sorry / axiom
        run: scripts/check_no_sorry_axiom.sh

  docs:
    name: Documentation (doc-gen4)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Only the newest push matters.
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      # Cache the doc-gen4 executable and its dependencies between runs.
      - name: Restore doc-gen4 cache
        id: doc-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/doc-gen4
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/UnicodeBasic
            .lake/packages/leansqlite
          key: docgen-${{ hashFiles('lean-toolchain', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json') }}

      - name: Build doc-gen4
        working-directory: docbuild
        run: |
          lake update ContinuumMechanics
          lake build doc-gen4

      - name: Save doc-gen4 cache
        if: steps.doc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/packages/doc-gen4
            .lake/packages/MD4Lean
            .lake/packages/BibtexQuery
            .lake/packages/UnicodeBasic
            .lake/packages/leansqlite
          key: ${{ steps.doc-cache.outputs.cache-primary-key }}

      - name: Build papers
        working-directory: papers
        run: lake build

      # Documents this repository's modules only; links to Mathlib go to the official docs.
      - name: Build documentation
        run: scripts/build_docs.sh

      # One artifact per attempt, so that re-running the job does not find two `github-pages`.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docbuild/.lake/build/doc
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
