name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, no sorry/axiom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail"

      - name: Check for sorry / axiom
        run: scripts/check_no_sorry_axiom.sh

  docs:
    name: Documentation (doc-gen4)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Build documentation
        working-directory: docbuild
        run: |
          lake update ContinuumMechanics
          lake exe cache get
          lake build ContinuumMechanics:docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

      - id: deployment
        uses: actions/deploy-pages@v4
