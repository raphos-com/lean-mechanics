name = "ContinuumMechanics"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["ClassicalMechanics", "ContinuumMechanics", "DiscreteMechanics"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Files carry no per-file copyright header (Apache-2.0, see LICENSE at the repository root).
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "ContinuumMechanics"

[[lean_lib]]
name = "DiscreteMechanics"

[[lean_lib]]
name = "ClassicalMechanics"
