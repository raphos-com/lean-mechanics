name = "ContinuumMechanics"
version = "0.1.0"
defaultTargets = ["ContinuumMechanics", "Nexorade", "Miura", "KaneLubensky"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib's copyright-header convention does not apply (no license chosen yet).
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "ContinuumMechanics"

[[lean_lib]]
name = "Nexorade"
srcDir = "papers"

[[lean_lib]]
name = "Miura"
srcDir = "papers"

[[lean_lib]]
name = "KaneLubensky"
srcDir = "papers"
